<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowchart</title>
    <style>
        body {
            display: grid;
            justify-content: center;
            place-items: center;
            /* Center both horizontally and vertically */
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 100px;
            /* Adjust as needed */
            overflow: hidden;
            /* Prevents scrollbars */
            background-color: #f2f3f7 !important;
            /* Optional background color */
        }

        .node {
            fill: #00e5ac;
            cursor: pointer;
            stroke: rgb(171, 192, 209);
            transition: transform 0.2s;
            stroke-width: 2px;
            rx: 10;
            ry: 10;
        }

        .node.hand-cursor {
            cursor: pointer;
            /* Hand cursor for specific nodes */
        }

        .node.pointer {
            cursor: pointer;
        }

        .node.special {
            cursor: pointer;
            /* Make sure the cursor changes to pointer */
        }

        .node.special:hover {
            transform: scale(1);
            fill: #ffa500;
            /* Change color on hover */
        }

        .node.highlighted {
            cursor: pointer;
            /* Hand cursor for highlighted nodes */
        }

        .label {
            text-anchor: middle;
            font-size: 12px;
            font-family: "Georgia, serif";
            cursor: pointer;
            pointer-events: none;
        }

        .link {
            fill: none;
            stroke: grey;
            stroke-width: 2px;
            stroke-dasharray: 5, 5;
            /* Dotted line */
            stroke-dashoffset: 100;
            /* Start with offset to hide the line */
            transition: stroke 0.2s;
        }

        .link:hover {
            stroke: #ff4500;
            /* Change link color on hover */
            stroke-width: 3px;
            /* Increase stroke width on hover */
        }

        .arrow {
            fill: rgb(111, 145, 219);
        }

        .highlighted {
            fill: rgb(236,
                    239,
                    76) !important;
            /* Background color for highlighted nodes */
            stroke: #000000 !important;
            /* Outline for highlighted nodes */
        }

        .highlighted-label {
            fill: #000000;
            /* Text color */
            /* No stroke here */
        }

        .highlighted text {
            font-size: 13px !important;
            /* Increase font size */
            stroke: none !important;
            /* Ensure no stroke is applied to text */
        }

        .hidden {
            visibility: hidden;
        }

        svg {
            width: 100%;
            /* Set the width to 100% of the viewport */
            height: 100vh;
            /* Set the height to 100% of the viewport */
            display: block;
            /* Ensures the SVG behaves as a block element */
            position: absolute;
            top: 80%;
            left: 80%;
            transform: translate(-80%, -80%);
            /* Center it */
        }

        #center-background {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            opacity: 0.05;
            max-width: 250vw;
            max-height: 100vh;
        }
    </style>
</head>

                            );
                            if (link) {
                                pathsToHighlight.push(link); // Store the link for highlighting
                            }
                        }
                    });
                } else {
                    // If no predefined path, collect all incoming links to the selected node
                    let currentId = selectedId;

                    while (currentId) {
                        const link = links.find((l) => l.targetId === currentId);
                        if (link) {
                            pathsToHighlight.unshift(link); // Add to the start to maintain order
                            currentId = link.sourceId; // Move to the source
                        } else {
                            currentId = null; // Stop if no link is found
                        }
                    }
                }

                // Hide all nodes, links, and labels
                svg.selectAll(".link").attr("class", "link hidden"); // Hide all paths
                svg.selectAll(".node").attr("class", "node hidden"); // Hide all nodes
                svg.selectAll(".label").attr("class", "label hidden"); // Hide all labels

                // Highlight the relevant links and nodes
                pathsToHighlight.forEach((link) => {
                    svg
                        .selectAll(".link")
                        .filter(
                            (d) =>
                                d.sourceId === link.sourceId && d.targetId === link.targetId
                        )
                        .attr("class", "link"); // Keep relevant paths visible
                });

                // Highlight the nodes and their labels along the path
                const highlightedNodeIds = new Set();
                pathsToHighlight.forEach((link) => {
                    highlightedNodeIds.add(link.sourceId);
                    highlightedNodeIds.add(link.targetId);
                });

                highlightedNodeIds.forEach((nodeId) => {
                    svg
                        .selectAll(".node")
                        .filter((d) => d.id === nodeId)
                        .attr("class", "node highlighted"); // Highlight nodes

                    // Highlight labels
                    svg
                        .selectAll(".label")
                        .filter((d) => d.id === nodeId)
                        .attr("class", "label highlighted-label"); // Use the new class for labels
                });

                highlightedNodes.add(selectedId);
            }
        }
    </script>
</body>

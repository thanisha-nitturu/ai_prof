*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh}
.page{max-width:1300px;margin:0 auto;padding:32px 20px 80px}
h1{text-align:center;font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#818cf8,#38bdf8,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px;margin-bottom:4px}
.sub{text-align:center;font-size:.65rem;font-weight:700;color:#475569;letter-spacing:3px;text-transform:uppercase;margin-bottom:40px}
/* Tree */
.tree{position:relative;padding-left:0}
.node{position:relative;margin-bottom:6px}
.node-head{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;cursor:pointer;transition:background .15s}
.node-head:hover{background:#1e293b}
.node-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}
.node-name{font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:700;color:#f1f5f9}
.node-desc{font-size:.6rem;color:#64748b;margin-left:8px;font-weight:500}
.node-tag{font-size:.5rem;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.5px;text-transform:uppercase;margin-left:auto;flex-shrink:0}
/* Colors */
.ic-root{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.ic-fe{background:linear-gradient(135deg,#06b6d4,#0ea5e9)}
.ic-be{background:linear-gradient(135deg,#10b981,#34d399)}
.ic-dir{background:#1e293b;border:1px solid #334155}
.ic-file{background:#0f172a;border:1px solid #1e293b}
.ic-cfg{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.ic-test{background:linear-gradient(135deg,#f43f5e,#fb7185)}
.ic-data{background:linear-gradient(135deg,#ec4899,#f472b6)}
.tg-fe{background:#083344;color:#22d3ee}
.tg-be{background:#052e16;color:#4ade80}
.tg-cfg{background:#451a03;color:#fbbf24}
.tg-file{background:#1e293b;color:#94a3b8}
.tg-test{background:#3f1219;color:#fda4af}
.tg-data{background:#500724;color:#f9a8d4}
/* Children */
.children{margin-left:20px;padding-left:20px;border-left:2px solid #1e293b;display:none}
.children.open{display:block}
.node-head .chevron{transition:transform .2s;color:#475569;font-size:.7rem;width:16px;text-align:center;flex-shrink:0}
.node-head .chevron.rotated{transform:rotate(90deg)}
/* Separator */
.sep{height:1px;background:#1e293b;margin:16px 0 16px 0}
.sec-label{font-size:.55rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#334155;margin-bottom:8px;padding-left:14px}
footer{text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid #1e293b;font-size:.55rem;color:#334155;font-weight:600;letter-spacing:2px;text-transform:uppercase}

function renderNode(node, container) {
  const el = document.createElement('div');
  el.className = 'node';
  const hasChildren = node.children && node.children.length > 0;
  const head = document.createElement('div');
  head.className = 'node-head';
  head.innerHTML = `
    ${hasChildren ? '<span class="chevron">▶</span>' : '<span class="chevron" style="opacity:.2">•</span>'}
    <div class="node-icon ${node.ic}">${node.icon}</div>
    <span class="node-name">${node.name}</span>
    <span class="node-desc">${node.desc}</span>
    ${node.tag ? `<span class="node-tag ${node.tc}">${node.tag}</span>` : ''}
  `;
  el.appendChild(head);
  if (hasChildren) {
    const ch = document.createElement('div');
    ch.className = 'children';
    node.children.forEach(c => renderNode(c, ch));
    el.appendChild(ch);
    head.addEventListener('click', () => {
      const open = ch.classList.toggle('open');
      head.querySelector('.chevron').classList.toggle('rotated', open);
    });
  }
  container.appendChild(el);
}

const tree = document.getElementById('tree');

tree.querySelector('.children').classList.add('open');
tree.querySelector('.chevron').classList.add('rotated');
